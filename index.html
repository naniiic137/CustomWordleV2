<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Custom Wordle</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toast-container"></div>
    <header>
        <div class="header-content">
            <h1>Wordle</h1>
        </div>
    </header>

    <main>
        <!-- Game Container -->
        <div id="game-container" class="hidden">
            <div id="game-board"></div>
            <div id="keyboard-container"></div>
            <button id="hint-button" class="action-button">
                💡 Hint <span id="hint-count">0</span>
            </button>
        </div>

        <!-- Landing page shown when no puzzle link is present -->
        <div id="creator-container">
            <div class="landing">
                <div id="landing-icon" class="landing-icon">🔒</div>
                <h2 id="landing-title" class="landing-title">You need a puzzle link to play</h2>
                <p id="landing-body" class="landing-body">Ask the person who challenged you to send you their link.</p>
                <a class="landing-make" href="creator.html">✏️ Make your own puzzle</a>
            </div>
        </div>
    </main>

    <!-- LOCAL DEV: using script.js (unobfuscated). Switch back to script.obf.js for production. -->
    <script src="script.obf.js"></script>
</body>

</html>
